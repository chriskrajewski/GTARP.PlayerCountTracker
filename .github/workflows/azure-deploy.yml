name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # - name: Run linting
      #   run: npm run lint
      #   continue-on-error: true

      # - name: Check TypeScript types
      #   run: npm run check-types
      #   continue-on-error: true

      - name: Verify public envs are present
        run: |
          node -e "console.log('NEXT_PUBLIC_SUPABASE_URL set:', !!process.env.NEXT_PUBLIC_SUPABASE_URL)"
          node -e "console.log('NEXT_PUBLIC_SUPABASE_ANON_KEY set:', !!process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY)"
      

      - name: Build application
        run: npm run build
        env:
          # Build-time environment variables
          NEXT_TELEMETRY_DISABLED: 1
          # Public Supabase credentials (REQUIRED - build will fail if not set)
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Server-side Supabase credentials (needed for build)
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare deployment
        run: |
          # Create deployment directory
          mkdir -p deploy
          # Copy standalone build to deployment folder
          cp -r .next/standalone/* deploy/
          # Copy public folder for static assets
          cp -r public deploy/
          # Copy static folder from .next for optimized assets
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/
          # List what we're deploying
          echo "Contents of deploy folder:"
          ls -la deploy/
          # Create zip file for deployment
          cd deploy && zip -r ../deploy.zip . && cd ..
          echo "Created deploy.zip"
          ls -la deploy.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E0CD9DF752B48879B7C24CB29A81DC5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7F81D57227A74874AE99B8AB7AC4BE74 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_941EC6ADC94F4D0FA09E74C4CD86EE50 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rpstats'
          slot-name: 'Production'
          package: deploy.zip

      - name: Restart Azure App Service
        run: |
          echo "Restarting Azure App Service to ensure new deployment takes effect..."
          az webapp restart --name rpstats --resource-group rpstats.com
          echo "App Service restart completed."
