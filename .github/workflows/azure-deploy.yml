name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Check TypeScript types
        run: npm run check-types
        continue-on-error: true

      - name: Build application
        run: npm run build
        env:
          # Build-time environment variables
          NEXT_TELEMETRY_DISABLED: 1
          # These should be build-time secrets only - runtime secrets set in Azure Portal
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E0CD9DF752B48879B7C24CB29A81DC5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7F81D57227A74874AE99B8AB7AC4BE74 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_941EC6ADC94F4D0FA09E74C4CD86EE50 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rpstats'
          slot-name: 'Production'
          package: .
