name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # - name: Run linting
      #   run: npm run lint
      #   continue-on-error: true

      # - name: Check TypeScript types
      #   run: npm run check-types
      #   continue-on-error: true

      - name: Write build env file
        run: |
          cat > .env.production <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF
          echo ".env.production written"

      - name: Verify public envs are present
        run: |
          node -e "console.log('NEXT_PUBLIC_SUPABASE_URL set:', !!process.env.NEXT_PUBLIC_SUPABASE_URL)"
          node -e "console.log('NEXT_PUBLIC_SUPABASE_ANON_KEY set:', !!process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY)"
      

      - name: Build application
        run: npm run build
        env:
          # Build-time environment variables
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare deployment
        run: |
          # Create deployment directory
          mkdir -p deploy
          # Copy standalone build to deployment folder
          cp -r .next/standalone/* deploy/
          # Copy public folder for static assets
          cp -r public deploy/
          # Copy static folder from .next for optimized assets
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/
          # List what we're deploying
          echo "Contents of deploy folder:"
          ls -la deploy/
          # Create zip file for deployment
          cd deploy && zip -r ../deploy.zip . && cd ..
          echo "Created deploy.zip"
          ls -la deploy.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AF1727F752AD4DB4A555B3CAC0B2BA2F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4350A6C4F16544198872F756486FE589 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_CF8825449BE942D0B7B6651EFDB47442 }}


      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rpstats'
          slot-name: 'Production'
          package: deploy.zip
